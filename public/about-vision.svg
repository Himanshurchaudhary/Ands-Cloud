<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Paper-cut illustration of a mountain trail leading to a flag at the summit under a large orange sun">
  <style>
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .dr{animation:dr 16s ease-in-out infinite alternate}
    .dr2{animation-duration:21s;animation-delay:-6s}
    .dr3{animation-duration:18s;animation-delay:-3s}
    @keyframes dr{to{transform:translateX(46px)}}
    .march{stroke-dasharray:0.1 14;animation:march 4s linear infinite}
    @keyframes march{to{stroke-dashoffset:-141}}
    .flag{transform-box:fill-box;transform-origin:left center;animation:flag 2.4s ease-in-out infinite}
    @keyframes flag{0%,100%{transform:skewY(0deg) scaleX(1)}50%{transform:skewY(-7deg) scaleX(.9)}}
    .bird{animation:bird 5s ease-in-out infinite}
    .bird2{animation-delay:-1.8s}
    .bird3{animation-delay:-3.2s}
    @keyframes bird{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,-10px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <defs>
    <!-- hand-cut paper edge + hard paper shadow -->
    <filter id="cut" x="-5%" y="-5%" width="112%" height="118%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feDropShadow in="d" dx="6" dy="8" stdDeviation="0" flood-color="#111" flood-opacity=".3"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="9" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.07  0 0 0 0 0.07  0 0 0 0 0.07  0 0 0 1.1 -0.45"/>
    </filter>

    <!-- halftone dots, faded with a mask -->
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <circle cx="7" cy="7" r="2.6" fill="#111" opacity=".55"/>
    </pattern>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="690" y="120" width="340" height="340">
      <rect x="690" y="120" width="340" height="340" fill="url(#g)"/>
    </mask>
    <clipPath id="sunclip"><circle cx="860" cy="290" r="165"/></clipPath>

    <!-- cloud made of a pill and two bumps -->
    <g id="cloud">
      <rect x="0" y="30" width="230" height="58" rx="29"/>
      <circle cx="78" cy="30" r="32"/>
      <circle cx="148" cy="22" r="42"/>
    </g>
  </defs>

  <!-- paper -->
  <rect width="1200" height="800" fill="#FFF4EC"/>

  <!-- sun with a slowly turning dotted ring -->
  <circle class="spin" cx="860" cy="290" r="205" fill="none" stroke="#111" stroke-width="3" stroke-dasharray="3 14" stroke-linecap="round"/>
  <g filter="url(#cut)"><circle cx="860" cy="290" r="165" fill="#FF6A00"/></g>
  <g clip-path="url(#sunclip)" mask="url(#fade)"><rect x="690" y="120" width="340" height="340" fill="url(#dots)"/></g>

  <!-- clouds drifting -->
  <g class="dr"><g filter="url(#cut)"><use href="#cloud" fill="#fff" transform="translate(110 120)"/></g></g>
  <g class="dr dr2"><g filter="url(#cut)"><use href="#cloud" fill="#fff" transform="translate(380 250) scale(.7)"/></g></g>
  <g class="dr dr3"><g filter="url(#cut)"><use href="#cloud" fill="#fff" transform="translate(940 70) scale(.8)"/></g></g>

  <!-- back range -->
  <g filter="url(#cut)">
    <path d="M-40 860 V520 L170 360 L280 470 L380 400 L560 620 V860 Z" fill="#FFC9A3"/>
  </g>

  <!-- main mountain + darker facet -->
  <g filter="url(#cut)">
    <path d="M130 800 L380 470 L440 520 L560 230 L690 450 L750 410 L1010 800 Z" fill="#111"/>
    <path d="M560 232 L690 452 L750 412 L1008 798 L700 798 L620 520 Z" fill="#262626"/>
  </g>

  <!-- right peak -->
  <g filter="url(#cut)">
    <path d="M760 860 L760 800 L960 520 L1070 640 L1130 570 L1240 700 V860 Z" fill="#fff"/>
  </g>

  <!-- snow cap -->
  <g filter="url(#cut)">
    <path d="M560 230 L526 322 L546 314 L564 346 L584 312 L610 326 Z" fill="#fff"/>
  </g>

  <!-- orange foreground hill -->
  <g filter="url(#cut)">
    <path d="M-40 860 V640 L0 640 C200 560 380 600 520 660 C700 740 900 620 1200 640 L1240 640 V860 Z" fill="#FF6A00"/>
  </g>

  <!-- trail of dots up to the summit -->
  <path class="march" d="M330 650 C420 620 360 580 450 550 C520 525 480 470 520 430 C535 410 540 380 548 352" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="330" cy="650" r="9" fill="#fff"/>
  <circle cx="330" cy="650" r="3.5" fill="#111"/>

  <!-- front black hill -->
  <g filter="url(#cut)">
    <path d="M-40 860 V730 L0 730 C240 690 480 750 720 720 C940 695 1080 705 1200 735 L1240 735 V860 Z" fill="#111"/>
  </g>

  <!-- flag on the summit -->
  <path d="M560 232 V132" stroke="#111" stroke-width="5" stroke-linecap="round"/>
  <circle cx="560" cy="130" r="6" fill="#111"/>
  <path class="flag" d="M562 136 L652 160 L562 186 Z" fill="#FF6A00" stroke="#111" stroke-width="3" stroke-linejoin="round"/>

  <!-- birds -->
  <g fill="none" stroke="#111" stroke-width="4" stroke-linecap="round">
    <g class="bird"><path d="M300 100 q12 -14 24 0 q12 -14 24 0"/></g>
    <g class="bird bird2"><path d="M350 140 q9 -10 18 0 q9 -10 18 0" stroke-width="3.5"/></g>
    <g class="bird bird3"><path d="M250 150 q7 -8 14 0 q7 -8 14 0" stroke-width="3"/></g>
  </g>

  <!-- small decoration -->
  <g stroke="#111" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M80 90 v24 M68 102 h24"/>
    <path d="M1100 330 v22 M1089 341 h22"/>
    <path d="M700 90 v20 M690 100 h20"/>
  </g>
  <rect x="1110" y="430" width="22" height="22" fill="#FF6A00" transform="rotate(18 1121 441)"/>
  <rect x="60" y="640" width="18" height="18" fill="#111" transform="rotate(-14 69 649)"/>
  <circle cx="1100" cy="200" r="6" fill="#111"/>
  <circle cx="90" cy="300" r="7" fill="#FF6A00"/>
  <circle cx="660" cy="520" r="5" fill="#FF6A00"/>

  <!-- paper grain on top of everything -->
  <rect width="1200" height="800" filter="url(#grain)" opacity=".5"/>
</svg>
